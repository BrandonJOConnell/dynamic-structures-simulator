[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dynsim"
version = "0.1.0"
description = "Randomised mass-spring-damper towers and chains with ground-truth labels, simulation, and TikZ/SVG diagrams."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Brandon John O'Connell" }]  # add email = "..." if you want one on PyPI
keywords = [
    "structural dynamics",
    "system identification",
    "operational modal analysis",
    "structural health monitoring",
    "mass-spring-damper",
    "benchmark",
    "tikz",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
examples = ["matplotlib>=3.7"]

[project.urls]
Homepage = "https://github.com/brandonjoconnell/dynamic-structures-simulator"
Issues = "https://github.com/brandonjoconnell/dynamic-structures-simulator/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "matplotlib>=3.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dynsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "latex: needs pdflatex and a PDF-to-SVG converter (skipped if missing; set DYNSIM_REQUIRE_LATEX=1 to fail instead)",
]

[tool.ruff]
line-length = 110
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B905"]  # zip(strict=...) needs Python 3.10+, which we require, but it adds noise
